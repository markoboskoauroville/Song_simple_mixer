# Pinned by commit, never by tag (the SHAs are TTT_MINI's, resolved 23.8.2026 from the tags in the comments).
name: Build Song simple mixer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # One permanent key (PKCS12), kept only as an encrypted repository secret: every build is signed the
      # same way, so a new version installs straight over the old one (MANTRA_MANIFEST android-app.md §3, §3b).
      - name: Restore the signing key
        env:
          KS: ${{ secrets.MIXER_KEYSTORE }}
          KS_PW: ${{ secrets.MIXER_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "No keystore secret: this build could not be installed over the last one. Stopping."
            exit 1
          fi
          echo "$KS" | base64 -d > mixer.p12
          printf 'storeFile=mixer.p12\nstorePassword=%s\nkeyAlias=mixer\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > keystore.properties

      - name: "Gate G3 — verify.py"
        run: python3 scripts/verify.py

      - name: "Test 1 — the mechanism (JUnit, no Android)"
        run: ./gradlew :app:testReleaseUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -x lintVitalRelease --no-daemon -PprojectVersionCode=$((1000 + ${{ github.run_number }}))

      - name: "Gate G2 — scan the built APK for keys"
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "scanning: $apk ($(stat -c%s "$apk") bytes)"
          hits=$(strings -a "$apk" | grep -acE '(gsk_|AIza|ghp_|github_pat_|sk-ant-|xox[baprs]-)[A-Za-z0-9_-]{20,}' || true)
          hits=${hits:-0}
          echo "key-shaped strings found: $hits"
          [ "$hits" -eq 0 ] || { echo "A key shape is in the artefact. Stopping."; exit 1; }

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" song-simple-mixer-build-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" song-simple-mixer-build-${{ github.run_number }}.apk \
            --title "Song simple mixer build ${{ github.run_number }}" \
            --notes "Mantra Productions. One vocal, one backing track, two faders, a timing nudge, export the mix as WAV."

      - name: Keep the two newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --yes --cleanup-tag || true
          done
